apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-k8s-deployment
  labels:
    app: python-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-app
  template:
    metadata:
      labels:
        app: python-app
    spec:
      containers:
      - name: python-container
        image: python-demo:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: python-k8s-service
spec:
  type: ClusterIP
  selector:
    app: python-app
  ports:
  - port: 8080
    targetPort: 8080